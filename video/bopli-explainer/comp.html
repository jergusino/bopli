<style>

*{box-sizing:border-box;margin:0;padding:0}

<body>
<div id="stage">

  <!-- S1 typing -->
  <div class="scene" id="s1">
    <div class="abs" id="s1cam" style="left:0;top:0;width:1440px;height:1080px;transform-origin:720px 540px">

        <div class="abs" id="s1word" style="top:6px;font:600 92px/1 'In';letter-spacing:-.02em"></div>
        <div class="abs" id="s1typed" style="top:6px;font:500 92px/1 'In';letter-spacing:-.02em"></div>

        <div class="abs" id="s1caret" style="top:6px;width:6px;height:96px;background:#222;border-radius:2px"></div>
        <div class="handle" id="s1hL" style="top:-4px;height:116px"><i style="top:-26px"></i></div>
        <div class="handle" id="s1hR" style="top:-4px;height:116px"><i style="bottom:-26px"></i></div>
        <svg class="abs" id="s1slash" width="80" height="110" viewBox="0 0 80 110" style="top:0"><path id="s1slashp" d="M58 8 L22 100" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/></svg>
        <div class="abs" id="s1badge" style="top:-4px;width:118px;height:118px;border-radius:50%;background:var(--blue);border:6px solid #fff;box-shadow:0 0 0 3px #0B3D85 inset">
          <svg viewBox="0 0 120 100" width="78" height="66" style="position:absolute;left:14px;top:20px"><path d="M108 46C97 27 82 16 64 16C48 16 37 25 29 37L12 23C8 20 3 23 5 28L16 52L5 76C3 81 8 84 12 81L29 67C37 79 48 88 64 88C82 88 97 77 108 58Q112 52 108 46Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/><circle cx="75" cy="44" r="13" fill="#1D7CF2"/><circle cx="79" cy="45" r="7" fill="#0E2A57"/></svg>
        </div>
      </div>
    </div>
    <div class="abs" id="s1bloom" style="left:720px;top:540px;width:0;height:0;border-radius:50%;background:#fff"></div>
  </div>

  <!-- S2 distance tracker -->
  <div class="scene" id="s2" style="background:linear-gradient(180deg,#2C8BF6 0%,#1D74E6 45%,#0F55B8 100%)">
    <div class="abs" id="s2all" style="inset:0">
      <div class="abs" style="left:52px;top:52px;color:#fff">
        <div style="font:600 13px/1 'In';letter-spacing:.08em;opacity:.62">SHARING</div>
        <div style="font:600 19px/1.4 'In'">Mom's Bopli widget</div>
      </div>
      <div class="abs" style="left:1366px;top:58px;width:22px;height:46px;border-radius:12px;background:#08142A"></div>
      <div class="abs" id="s2ring" style="border-radius:50%;background:rgba(255,255,255,.3)"></div>
      <div class="abs" id="s2coinwrap" style="left:548px;top:368px;width:344px;height:344px;perspective:1400px">
        <div class="abs" id="s2coin" style="inset:0;transform-style:preserve-3d"></div>
      </div>
      <div class="abs" id="s2num" style="left:52px;top:842px;color:#fff;font:400 58px/1 'In';letter-spacing:-.01em"></div>
      <div class="abs" id="s2lab" style="left:52px;top:912px;color:rgba(255,255,255,.78);font:400 58px/1 'In';letter-spacing:-.01em;white-space:nowrap"></div>
      <div class="abs" id="s2here" style="left:52px;top:912px;color:#fff;font:500 58px/1 'In'">right here</div>
    </div>
  </div>

  <!-- S3 photo cuts -->
  <div class="scene" id="s3">
    <div class="abs" id="s3shots" style="inset:0"></div>
    <div class="abs" id="s3chrome" style="right:22px;top:0;bottom:0;width:60px"></div>
  </div>

  <!-- S4 line circle + rings, frame shrinks into shutter -->
  <div class="scene" id="s4" style="background:#0B0B0B">
    <div class="abs" id="s4frame" style="overflow:hidden;background:var(--paper)">
      <div class="abs" id="s4inner" style="left:0;top:0;width:1440px;height:1080px;transform-origin:0 0">
        <svg class="abs" id="s4svg" width="1440" height="1080" style="left:0;top:0"></svg>
        <div class="abs" id="s4rings" style="left:720px;top:510px;width:0;height:0"></div>
      </div>
      <div class="abs" id="s4white" style="inset:0;background:#F4F4F2;opacity:0"></div>
    </div>
  </div>

  <!-- S5 camera -->
  <div class="scene" id="s5" style="background:#0B0B0B">
    <div class="abs" id="s5top" style="left:0;right:0;top:52px;height:40px;color:#fff">
      <svg class="abs" id="s5x" style="left:398px;top:6px" width="26" height="26" viewBox="0 0 26 26"><path d="M4 4L22 22M22 4L4 22" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="abs" id="s5title" style="left:0;right:0;top:6px;text-align:center;font:600 21px/1 'In'"></div>
      <svg class="abs" id="s5grid" style="left:1018px;top:5px" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2.4"><rect x="3" y="3" width="9" height="9" rx="2"/><rect x="16" y="3" width="9" height="9" rx="2"/><rect x="3" y="16" width="9" height="9" rx="2"/><rect x="16" y="16" width="9" height="9" rx="2"/></svg>
    </div>
    <div class="vf" id="s5vf"><div class="abs" id="s5scene" style="left:0;top:0;width:700px;height:700px"></div></div>
    <div class="abs" id="s5flash" style="width:64px;height:64px;border-radius:50%;background:#1E1E1E"><svg width="64" height="64" viewBox="0 0 64 64"><path d="M34 16L22 35h9l-3 13 13-20h-9l3-12z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><path d="M18 18L46 46" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></div>
    <div class="abs" id="s5flip" style="width:64px;height:64px;border-radius:50%;background:#1E1E1E"><svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M44 27a13 13 0 0 0-23-5"/><path d="M20 37a13 13 0 0 0 23 5"/><path d="M21 15v8h8"/><path d="M43 49v-8h-8"/></svg></div>
    <div class="abs" id="s5btn" style="border-radius:50%;background:#F4F4F2"></div>
  </div>

  <!-- S6 canvas board -->
  <div class="scene" id="s6" style="background:#EDEDE9">
    <div class="abs" id="s6dots" style="inset:-200px;background-image:radial-gradient(circle,#C9C9C4 1.6px,transparent 2px);background-size:26px 26px"></div>
    <div class="abs" id="s6world" style="inset:0;perspective:1600px;perspective-origin:720px 540px"></div>
    <div class="abs" style="left:34px;top:30px;font:700 21px/1 'In';color:#111">Today <span style="font-weight:500;color:#999;font-size:16px">⌄</span></div>
    <div class="abs" id="s6side" style="left:1376px;top:30px;width:44px;height:200px"></div>
    <div class="abs" id="s6tools" style="left:30px;top:960px;width:600px;height:84px;border-radius:42px;background:rgba(255,255,255,.92);box-shadow:0 8px 30px rgba(0,0,0,.14)"></div>
    <div class="abs" id="s6dark" style="inset:0;background:#0B0B0B;opacity:0"></div>
  </div>

  <!-- S7 big word -->
  <div class="scene" id="s7" style="background:#0B0B0B;perspective:1100px;perspective-origin:720px 540px">
    <div class="abs" id="s7word" style="left:720px;top:540px;width:0;height:0;transform-style:preserve-3d"></div>
  </div>

  <!-- S8 + S9 line, chat -->
  <div class="scene" id="s8" style="background:var(--paper)">
    <div class="abs" id="s8cam" style="left:0;top:0;width:1440px;height:1080px;transform-origin:0 0">
      <div class="abs" id="s8chat" style="inset:0"></div>
      <div class="abs" id="s8line" style="left:0;top:0;height:140px;white-space:nowrap"></div>
    </div>
  </div>

  <!-- S10 glitch + end -->
  <div class="scene" id="s10" style="background:#0A0A0A">
    <div class="abs" id="s10glitch" style="inset:0"></div>
    <svg class="abs" id="s10spin" width="40" height="40" viewBox="-20 -20 40 40" style="left:700px;top:520px"></svg>
    <div class="abs" id="s10mark" style="left:0;right:0;top:470px;text-align:center;color:#fff;opacity:0">
      <div style="display:inline-flex;align-items:center;gap:14px">
        <svg viewBox="0 0 120 100" width="92" height="77"><path d="M108 46C97 27 82 16 64 16C48 16 37 25 29 37L12 23C8 20 3 23 5 28L16 52L5 76C3 81 8 84 12 81L29 67C37 79 48 88 64 88C82 88 97 77 108 58Q112 52 108 46Z" fill="#1D7CF2" stroke="#1D7CF2" stroke-width="8" stroke-linejoin="round"/><circle cx="75" cy="44" r="13" fill="#fff"/><circle cx="79" cy="45" r="7" fill="#1B2B4B"/></svg>
        <span style="font:800 80px/1 'Nun';color:#1D7CF2;letter-spacing:-.01em">Bopli</span>
      </div>
      <div style="font:700 15px/1 'Liberation Mono',monospace;color:rgba(255,255,255,.55);margin-top:22px;letter-spacing:.04em">one photo a day · coming soon to iPhone · join the waitlist</div>
    </div>
  </div>

  <div class="cap" id="cap"></div>
  <canvas id="grain" width="480" height="360" style="position:absolute;inset:0;width:1440px;height:1080px;mix-blend-mode:overlay;opacity:0;pointer-events:none;z-index:60"></canvas>
</div>

<script>
"use strict";
const W = 1440, H = 1080, DUR = 18.84;
const $ = id => document.getElementById(id);

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: p => p,
  out: p => 1 - Math.pow(1 - p, 3),
  in: p => p * p * p,
  io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  sine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  xo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  xio: p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
  step: p => p >= 1 ? 1 : 0,
  back: p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
// damped spring 0 -> 1, s = seconds since start
const spring = (s, w = 18, z = .42) => s <= 0 ? 0 : 1 - Math.exp(-z * w * s) * (Math.cos(w * Math.sqrt(1 - z * z) * s) + z / Math.sqrt(1 - z * z) * Math.sin(w * Math.sqrt(1 - z * z) * s));
// keyframes: [[t, v, ease], ...]; ease shapes the segment arriving at that key
function K(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    if (t <= t1) { const [t0, v0] = keys[i - 1]; return lerp(v0, v1, (E[e || 'io'])(P(t, t0, t1))); }
  }
  return keys[keys.length - 1][1];
}
// smooth handheld noise
const wob = (t, s = 1, f = 1) => s * (Math.sin(t * 2.1 * f + 1.3) * .6 + Math.sin(t * 3.7 * f + .2) * .3 + Math.sin(t * 7.3 * f + 2.1) * .1);
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

const mctx = document.createElement('canvas').getContext('2d');
const mw = (txt, font) => { mctx.font = font; return mctx.measureText(txt).width; };

const FISH = '<path d="M108 46C97 27 82 16 64 16C48 16 37 25 29 37L12 23C8 20 3 23 5 28L16 52L5 76C3 81 8 84 12 81L29 67C37 79 48 88 64 88C82 88 97 77 108 58Q112 52 108 46Z"';

/* ---------- illustrations ---------- */
const PEOPLE = [
  ['photos/person-mom.jpg', '50% 30%'], ['photos/person-dad.jpg', '50% 22%'], ['photos/person-sister.jpg', '50% 25%'],
  ['photos/person-grandma.jpg', '62% 35%'], ['photos/person-you.jpg', '50% 22%']];
function avatar(k) { const [src, pos] = PEOPLE[k]; return `<img src="${src}" style="display:block;width:100%;height:100%;object-fit:cover;object-position:${pos}">`; }
const shot = (src, pos, extra = '') => `<img src="${src}" style="position:absolute;inset:0;width:1440px;height:1080px;object-fit:cover;object-position:${pos}">${extra}`;
function shotSunrise() { return shot('photos/shot-sunrise.jpg', '50% 50%', `<svg class="abs" width="1440" height="1080" style="left:0;top:0"><circle id="sunring" cx="338" cy="398" r="120" fill="none" stroke="#fff" stroke-width="5" opacity="0"/></svg>`); }
function shotHome() { return shot('photos/shot-homescreen.jpg', '50% 50%'); }
function shotCoffee() { return shot('photos/shot-latte.jpg', '50% 28%'); }
function shotLock() { return shot('photos/shot-lens.jpg', '50% 45%'); }
function deskScene() { return ''; }
function phoneNote() {
  return `<div class="abs" id="s5phone" style="left:-40px;top:-40px;width:780px;height:780px"><img src="photos/person-you.jpg" style="width:100%;height:100%;object-fit:cover;object-position:50% 20%"></div>
    <div class="abs" id="s5w1" style="left:56px;top:430px;padding:0 40px 10px 6px;font:700 112px/1 'Hand';color:#fff;transform:rotate(-8deg);text-shadow:0 3px 14px rgba(0,0,0,.35)">good</div>
    <div class="abs" id="s5w2" style="left:150px;top:530px;padding:0 40px 10px 6px;font:700 100px/1 'Hand';color:#fff;transform:rotate(-6deg);white-space:nowrap;text-shadow:0 3px 14px rgba(0,0,0,.35)">morning</div>
    <div class="abs" id="s5w3" style="left:330px;top:410px;font:700 74px/1 'Hand';color:#FFD34D;text-shadow:0 3px 14px rgba(0,0,0,.35)">☀</div>
    <div class="abs" id="s5thumb" style="display:none"></div>`;
}

/* ---------- caption track ---------- */
const CAPS = [[0, 'one photo'], [1.08, 'every single morning'], [1.62, 'from wherever they are'], [3.0, '(right here)'], [3.6, 'on their home screen'], [4.2, 'all day, together.'], [5.6, 'snap one. send it. done.'], [7.9, 'to the people you pick'], [10.55, 'miles apart'], [11.95, 'still close..'], [13.1, 'they saw your morning'], [14.62, 'bopli is coming soon'], [16.1, '']];
function caption(t) {
  let s = ''; for (const [a, txt] of CAPS) if (t >= a) s = txt;
  const el = $('cap'); el.textContent = s;
  const dark = (t >= 1.08 && t < 4.2) || (t >= 5.45 && t < 7.9) || (t >= 9.9 && t < 11.1) || t >= 16.1;
  el.style.color = dark ? 'rgba(255,255,255,.82)' : 'rgba(20,20,20,.8)';
}

/* =====================================================================
   S1  typing: "one [photo] evry mornig" -> "one photo every morning" + badge
   ===================================================================== */
const S1 = {};
function initS1() {
  S1.F1 = "600 92px In"; S1.F2 = "500 92px In";
  const ls = -.02 * 92;
  S1.word = 'photo'; S1.typo = 'evry mornig'; S1.fix = 'every morning';
  S1.wOne = mw('one', "italic 400 118px Ser");
  S1.wTimes = [...S1.word].map((_, i) => .24 + i * .055);
  S1.tTimes = [...S1.typo].map((_, i) => .53 + i * .041);
  S1.cw = s => [...s].map((c, i) => mw(s.slice(0, i + 1), i ? S1.F2 : S1.F2) - mw(s.slice(0, i), S1.F2) + ls);
  S1.wordW = [...S1.word].map((c, i) => mw(S1.word.slice(0, i + 1), S1.F1) - mw(S1.word.slice(0, i), S1.F1) + ls);
  S1.typoW = S1.cw(S1.typo); S1.fixW = mw(S1.fix, S1.F2) + ls * S1.fix.length;
  let d = ''; for (let i = 0; i < 40; i++) d += `<i style="position:absolute;top:0;left:${i * 17}px;width:12px;height:12px;border-radius:50%;background:#C8102E;opacity:0"></i>`;
  $('s1dots').innerHTML = d;
}
function renderS1(t) {
  const g = (times, ws, k = .09) => times.reduce((a, tt, i) => a + ws[i] * E.out(P(t, tt, tt + k)), 0);
  const gx = 18, oneX = 0, hlL = S1.wOne + gx;
  const wordW = g(S1.wTimes, S1.wordW);
  const hlR = hlL + 14 + Math.max(wordW, 6) + 12;
  const fixed = t >= 1.08;
  const typedW = fixed ? lerp(g(S1.tTimes, S1.typoW), S1.fixW, E.xo(P(t, 1.06, 1.16))) : g(S1.tTimes, S1.typoW);
  const typX = hlR + 30;
  const badgeIn = P(t, 1.2, 1.34);
  const total = typX + typedW + 14 + (t > 1.12 ? 160 * E.out(P(t, 1.12, 1.3)) : 0);
  const sc = K(t, [[0, 1.06], [1.0, 1.0, 'sine'], [1.14, .84, 'xo'], [1.5, .87, 'sine'], [1.6, 1.25, 'in']]);
  const line = $('s1line');
  line.style.left = (720 - total / 2) + 'px';
  $('s1cam').style.transform = `translate(${wob(t, 3)}px,${wob(t + 3, 2)}px) scale(${sc})`;
  // handwritten "one"
  const hw = E.sine(P(t, 0, .2)) * 120;
  const one = $('s1one');
  one.style.left = oneX + 'px';
  one.style.webkitMaskImage = `linear-gradient(90deg,#000 ${hw - 12}%,transparent ${hw}%)`;
  // selection
  const hp = E.back(P(t, .17, .27));
  $('s1hl').style.left = hlL + 'px'; $('s1hl').style.width = (hlR - hlL) * clamp(hp * 1.2) + 'px';
  const hL = $('s1hL'), hR = $('s1hR');
  hL.style.left = (hlL - 3) + 'px'; hR.style.left = (hlR - 3) + 'px';
  const hs = fixed ? lerp(1, .62, E.xo(P(t, 1.05, 1.15))) : 1;
  hL.style.transform = `scale(${hp * hs})`; hR.style.transform = `scale(${hp * hs})`;
  hL.style.transformOrigin = '50% 0'; hR.style.transformOrigin = '50% 100%';
  // word
  const wEl = $('s1word'); wEl.style.left = (hlL + 14) + 'px';
  wEl.innerHTML = [...S1.word].map((c, i) => { const a = P(t, S1.wTimes[i], S1.wTimes[i] + .08); return a > 0 ? `<span style="opacity:${.25 + .75 * a}">${c}</span>` : ''; }).join('');
  // typed
  const tEl = $('s1typed'); tEl.style.left = typX + 'px';
  if (!fixed) tEl.innerHTML = [...S1.typo].map((c, i) => { const a = P(t, S1.tTimes[i], S1.tTimes[i] + .07); return a > 0 ? `<span style="opacity:${.2 + .8 * a}">${c === ' ' ? '&nbsp;' : c}</span>` : ''; }).join('');
  else tEl.innerHTML = t < 1.12 ? 'every mornin' : S1.fix;
  // dots under typo
  const dots = $('s1dots').children; const nd = Math.floor(typedW / 17);
  for (let i = 0; i < dots.length; i++) { dots[i].style.opacity = (!fixed || t < 1.09) && i < nd ? (fixed ? 1 - P(t, 1.04, 1.09) : 1) : 0; }
  $('s1dots').style.left = typX + 'px';
  // caret
  const cr = $('s1caret'); cr.style.left = (typX + typedW + 6) + 'px';
  cr.style.opacity = t > .48 && t < 1.12 ? 1 : 0;
  // colors: light -> dark flip
  const k = E.sine(P(t, 1.0, 1.12));

  menu.style.transform = `translate(${lerp(300, 0, mp) - 40 * P(t, 15.2, 15.6) - 110 * scroll}px,${-110 * scroll + 20}px)`;
  menu.style.top = '600px';
  // camera zoom-in on the typed text
  const z = E.xo(P(t, 14.74, 14.88));
  const sc = lerp(1, 2.05, z);
  const follow = -70 * E.sine(P(t, 14.8, 15.6));     // camera keeps drifting with the caret
  $('s8cam').style.transform = `translate(${lerp(0, -170 * 2.05 + 40 + follow, z)}px,${lerp(0, -410 * 2.05 + 520, z)}px) scale(${sc})`;
  $('s8chat').style.opacity = show ? 1 : 0;
}

/* =====================================================================
   S10 glitch -> spinner -> wordmark
   ===================================================================== */
function renderS10(t) {
  const g = $('s10glitch');
  const gp = P(t, 16.05, 16.26);
  if (t < 16.26) {
    if (!g.dataset.built) {
      renderS8(16.0);
      const src = $('s8').cloneNode(true); src.removeAttribute('id'); src.style.display = 'block';
      src.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
      let h = '';
      for (let i = 0; i < 18; i++) h += `<div class="abs gsl" style="inset:0;overflow:hidden">${src.outerHTML}</div>`;
      g.innerHTML = h + '<div class="abs" id="gnoise" style="inset:0"></div>';
      g.dataset.built = 1;
    }
    const r = rng(1000 + Math.floor(t * 60));
    const sl = g.querySelectorAll('.gsl');
    sl.forEach((el, i) => {
      const y0 = i / sl.length * 100, y1 = (i + 1) / sl.length * 100;
      const black = r() < gp * 1.25;
      el.style.clipPath = `inset(${y0}% 0 ${100 - y1}% 0)`;
      el.style.transform = `translateX(${(r() - .5) * 140 * gp}px)`;
      el.style.filter = black ? 'brightness(0)' : (r() < .35 ? `drop-shadow(${6 * gp}px 0 0 rgba(255,0,80,.8)) drop-shadow(${-6 * gp}px 0 0 rgba(0,200,255,.8))` : 'none');
    });
    let nz = '';
    for (let i = 0; i < 40 * gp; i++) nz += `<i style="position:absolute;left:${(r() * 1440) | 0}px;top:${(r() * 1080) | 0}px;width:${(20 + r() * 200) | 0}px;height:${(3 + r() * 14) | 0}px;background:${r() < .5 ? '#fff' : ['#7CFF6B', '#FF4FD8', '#4FB4FF', '#ddd'][(r() * 4) | 0]};opacity:${.5 + r() * .5}"></i>`;
    $('gnoise').innerHTML = nz;
    g.style.display = 'block';
  } else g.style.display = 'none';
  // spinner
  const sp = $('s10spin');
  if (!sp.dataset.b) { sp.innerHTML = Array.from({ length: 8 }, (_, i) => `<path d="M0 -9 L0 -15" stroke="#fff" stroke-width="3.4" stroke-linecap="round" transform="rotate(${i * 45})"/>`).join(''); sp.dataset.b = 1; }
  const step = Math.floor(t * 12) % 8;
  [...sp.children].forEach((p, i) => p.setAttribute('opacity', (((i - step + 8) % 8) / 8) * .55 + .08));
  sp.style.opacity = t > 16.26 ? (1 - P(t, 17.0, 17.2)) * .9 : 0;
  const m = E.out(P(t, 17.2, 17.7)); const mk = $('s10mark');
  mk.style.opacity = m * (1 - P(t, 18.55, 18.84));
  mk.style.transform = `translateY(${(1 - m) * 14}px)`; mk.style.filter = m < 1 ? `blur(${(1 - m) * 8}px)` : 'none';
}

/* ---------- scenes table ---------- */
const SCENES = [
  ['s1', 0, 1.6, renderS1], ['s2', 1.6, 3.6, renderS2], ['s3', 3.6, 4.2, renderS3], ['s4', 4.2, 5.74, renderS4],
  ['s5', 5.7, 7.9, renderS5], ['s6', 7.9, 10.56, renderS6], ['s7', 10.55, 11.1, renderS7], ['s8', 11.1, 16.05, renderS8], ['s10', 16.05, 99, renderS10],
];
function grain(t) {
  const on = (t >= 3.6 && t < 4.2) || (t >= 5.8 && t < 7.9);
  const c = $('grain'); c.style.opacity = on ? .22 : 0;
  if (!on) return;
  const x = c.getContext('2d'); const im = x.createImageData(480, 360); const r = rng(7 + Math.floor(t * 30));
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  x.putImageData(im, 0, 0);
}
window.__seek = function (t) {
  t = clamp(t, 0, DUR - 1e-4);
  for (const [id, a, b, fn] of SCENES) {
    const on = t >= a && t < b; const el = $(id);
    el.style.display = on ? 'block' : 'none';
    if (on) fn(t);
  }
  // z-order: S4 frame floats over S5 while it shrinks
  $('s4').style.zIndex = 5; $('s5').style.zIndex = 4; $('s4').style.background = t > 5.2 ? 'transparent' : '#0B0B0B';
  if (t >= 5.2 && t < 5.74) { $('s5').style.display = 'block'; renderS5(t); }
  caption(t); grain(t);
};
window.__dur = DUR;
window.__ready = (async () => {
  await Promise.all(['200 20px In', '300 20px In', '400 20px In', '500 20px In', '600 20px In', '700 20px In', '800 20px In', 'italic 400 20px Ser', '700 20px Hand', '800 20px Nun', '20px "Noto Color Emoji"'].map(f => document.fonts.load(f, 'a😀')));
  await document.fonts.ready;
  initS1(); initS2(); initS3(); initS4(); initS5(); initS6(); initS7(); initS8();
  window.__seek(0);
  return true;
})();
// preview: ?t=1.2 or ?play
const qs = new URLSearchParams(location.search);
window.__ready.then(() => {
  if (qs.has('t')) window.__seek(+qs.get('t'));
  if (qs.has('play')) { const t0 = performance.now(); const loop = () => { window.__seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
});
</script>

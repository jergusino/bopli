<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kľúčenka — Jedna fotka ráno. Celý deň spolu.</title>
<meta name="description" content="Každé ráno sa odfotíš a tvoja rodina a kamaráti ťa celý deň vidia vo widgete na ploche telefónu. Pridaj sa na zoznam čakateľov.">
<meta property="og:title" content="Kľúčenka — Jedna fotka ráno. Celý deň spolu.">
<meta property="og:description" content="Súkromná fotka dňa pre rodinu a kamarátov na diaľku. Priamo na ploche telefónu.">
<meta name="theme-color" content="#E9ECEF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23272727'/><circle cx='32' cy='34' r='12' fill='none' stroke='%23AEE4F2' stroke-width='5'/><rect x='22' y='14' width='20' height='8' fill='%23AEE4F2'/></svg>">
<style>
:root{--ink:#1A1A1A;--muted:#555;--sans:"Lucida Grande","Lucida Sans Unicode","Lucida Sans",Geneva,Verdana,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:#E9ECEF}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 16px;
  background:repeating-linear-gradient(#FFFFFF 0 2px,#EEF0F2 2px 4px);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}

.win{width:100%;max-width:620px;background:#fff;border:1px solid rgba(0,0,0,.4);border-radius:10px 10px 7px 7px;overflow:hidden;
  box-shadow:0 22px 50px -12px rgba(0,0,0,.45)}
.tb{height:30px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #8E949C;
  background:repeating-linear-gradient(rgba(255,255,255,.55) 0 1px,transparent 1px 2px),linear-gradient(#F5F6F8,#D4D8DE 55%,#C3C8CF);
  font:700 13px var(--sans);color:#222;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.lights{position:absolute;left:12px;top:7px;display:flex;gap:8px}
.lights i{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.35);
  background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.95) 0 18%,transparent 42%),radial-gradient(circle at 50% 85%,var(--l2),var(--l1) 70%)}
.lights i:nth-child(1){--l1:#E0342A;--l2:#FF9A8F}.lights i:nth-child(2){--l1:#E09A0E;--l2:#FFE08A}.lights i:nth-child(3){--l1:#2EA52A;--l2:#A6F29A}
main{padding:44px 48px 40px}

h1{font:700 clamp(32px,6vw,44px)/1.12 var(--sans);letter-spacing:-.03em;margin-bottom:16px}
.lead{font-size:17px;color:var(--muted)}

/* aqua gel button */
.aqua{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:12px;
  height:52px;padding:0 30px;border:2px solid #2A3FBF;border-radius:999px;cursor:pointer;font:700 17px var(--sans);color:#0B0B1E;
  background:linear-gradient(#A9CCFF 0%,#7FB2FF 48%,#5C9BFF 52%,#B4E1FF 100%);
  box-shadow:inset 0 -3px 8px rgba(255,255,255,.55),inset 0 2px 3px rgba(0,0,0,.18),0 3px 8px -2px rgba(0,0,0,.3);transition:filter .15s,transform .1s}
.aqua::before{content:"";position:absolute;left:12px;right:12px;top:3px;height:44%;border-radius:999px;
  background:linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,.2));pointer-events:none}
.aqua>*{position:relative}
.aqua svg{width:22px;height:18px;flex:none}
.aqua:hover{filter:brightness(1.06) saturate(1.15)}
.aqua:active{transform:translateY(1px);filter:brightness(.92) saturate(1.25)}
.aqua:disabled{filter:grayscale(.8);opacity:.75;cursor:wait}

form.join{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
.join input[type=email]{flex:1 1 220px;font:16px var(--sans);padding:0 22px;height:52px;border:1px solid #8E949C;border-top-color:#5E646C;border-radius:999px;background:#fff;color:var(--ink);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.22)}
.join input[type=email]::placeholder{color:#9A9A9A}
.join input[type=email]:focus{outline:none;border-color:#3A7BE8;box-shadow:inset 0 2px 3px rgba(0,0,0,.2),0 0 0 4px rgba(84,150,255,.55)}
.join .hp{position:absolute;left:-9999px}
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(84,150,255,.6)}
.msg{font-size:13px;font-weight:700;margin-top:12px;min-height:1.5em}
.msg.ok{color:#2A7A3E}.msg.err{color:#B3261E}
.fine{font-size:12.5px;color:var(--muted)}
footer{margin-top:28px;padding-top:16px;border-top:1px solid #E2E5E9;font-size:12px;color:#777}

@media (max-width:520px){main{padding:30px 22px 26px}.aqua{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="win">
  <div class="tb"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span><span>Kľúčenka</span></div>
  <main>
    <h1>Jedna fotka ráno.<br>Celý deň spolu.</h1>
    <p class="lead">Každé ráno sa odfotíš a tvoja rodina a kamaráti ťa celý deň vidia vo widgete na ploche telefónu. Čoskoro pre iPhone.</p>
    <form class="join" novalidate>
      <label class="hp">Nevypĺňaj <input name="web" tabindex="-1" autocomplete="off"></label>
      <input type="email" name="email" required placeholder="tvoj@email.sk" aria-label="Tvoj e-mail" autocomplete="email">
      <button class="aqua" type="submit"><svg viewBox="0 0 22 18" aria-hidden="true"><rect x="1" y="1" width="20" height="16" rx="2.5" fill="#0B0B1E"/><path d="M2.5 3 11 9.5 19.5 3" fill="none" stroke="#9CC6FF" stroke-width="2" stroke-linejoin="round"/></svg><span>Pridať sa</span></button>
    </form>
    <p class="msg" role="status" aria-live="polite"></p>
    <p class="fine">Napíšeme ti len raz, keď bude appka pripravená. E-mail na požiadanie kedykoľvek zmažeme.</p>
    <footer>© 2026 Kľúčenka · Vyrobené na Slovensku</footer>
  </main>
</div>

<script>
// Google Form that stores signups (responses land in its linked sheet).
const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSe2jCU2iQYQNQEAx4oPuvY78fW7-LNIgKsOGF9Z-ac9x--NqQ/formResponse";
const ENTRY = "entry.995723584";
const okEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

document.querySelectorAll("form.join").forEach(f => f.addEventListener("submit", async e => {
  e.preventDefault();
  const msg = f.nextElementSibling, btn = f.querySelector("button");
  const email = f.email.value.trim();
  msg.className = "msg";
  if (f.web.value) return;                       // honeypot: bot
  if (!okEmail(email)) { msg.textContent = "Skontroluj, prosím, e-mailovú adresu."; msg.classList.add("err"); f.email.focus(); return; }
  btn.disabled = true;
  try {
    // no-cors: Google Forms returns an opaque response, so a network error is the only failure we can see
    await fetch(FORM, { method: "POST", mode: "no-cors", body: new URLSearchParams({ [ENTRY]: email }) });
    f.reset();
    msg.textContent = "Ďakujeme! Si na zozname. Ozveme sa, keď bude appka pripravená.";
    msg.classList.add("ok");
  } catch {
    msg.textContent = "Nepodarilo sa odoslať. Skús to, prosím, znova.";
    msg.classList.add("err");
  } finally { btn.disabled = false; }
}));
</script>
</body>
</html>

<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bopli — Jedna fotka ráno. Celý deň spolu.</title>
<meta name="description" content="Každé ráno sa odfotíš a tvoja rodina a kamaráti ťa celý deň vidia vo widgete na ploche telefónu. Pridaj sa na zoznam čakateľov.">
<meta property="og:title" content="Bopli — Jedna fotka ráno. Celý deň spolu.">
<meta property="og:description" content="Súkromná fotka dňa pre rodinu a kamarátov na diaľku. Priamo na ploche telefónu.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='4' y='14' width='56' height='44' rx='14' fill='%231D7CF2'/><rect x='22' y='6' width='20' height='10' rx='4' fill='%231559C0'/><circle cx='32' cy='36' r='14' fill='white'/><circle cx='32' cy='36' r='9' fill='%231B2B4B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1D7CF2;--blue-d:#1559C0;--blue-l:#DDEBFF;--ink:#3C3C3C;--muted:#777;--line:#E5E5E5;--sans:"Nunito","DIN Round Pro","Varela Round",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html{background:#fff}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:#fff;color:var(--ink);font:500 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
header{padding:18px 24px}
.brand{font-weight:800;font-size:28px;letter-spacing:-.01em;color:var(--blue)}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:40px 24px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mascot{width:150px;height:125px;margin-bottom:20px}
h1{font:800 clamp(30px,6vw,40px)/1.2 var(--sans);color:var(--ink);margin-bottom:14px}
.lead{font-size:18px;color:var(--muted);font-weight:600;max-width:460px}
form.join{margin-top:32px;display:flex;flex-direction:column;gap:14px;width:100%}
.join input[type=email]{width:100%;font:700 17px var(--sans);padding:0 18px;height:56px;border:2px solid var(--line);border-radius:16px;background:#F7F7F7;color:var(--ink);transition:border-color .15s,background .15s}
.join input[type=email]::placeholder{color:#AFAFAF}
.join input[type=email]:focus{outline:none;border-color:var(--blue);background:#fff}
.join .hp{position:absolute;left:-9999px}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;height:54px;padding:0 24px;border:0;border-radius:16px;cursor:pointer;
  font:800 16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);transition:filter .12s,transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.btn:disabled{background:#E5E5E5;color:#AFAFAF;box-shadow:0 5px 0 #CFCFCF;cursor:wait;filter:none}
:focus-visible{outline:3px solid var(--blue-l);outline-offset:2px}
.msg{font-size:15px;font-weight:700;margin-top:14px;min-height:1.5em}
.msg.ok{color:#2B9B4B}.msg.err{color:#EA2B2B}
.fine{font-size:14px;color:var(--muted);font-weight:600;max-width:440px}
footer{padding:20px 24px;border-top:2px solid var(--line);text-align:center;font-size:13px;font-weight:700;color:#AFAFAF;letter-spacing:.04em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><span class="brand">Bopli</span></header>
<main>
  <svg class="mascot" aria-hidden="true" viewBox="0 0 120 100"> <path d="M108 46C97 27 82 16 64 16C48 16 37 25 29 37L12 23C8 20 3 23 5 28L16 52L5 76C3 81 8 84 12 81L29 67C37 79 48 88 64 88C82 88 97 77 108 58Q112 52 108 46Z" fill="#1D7CF2" stroke="#1D7CF2" stroke-width="8" stroke-linejoin="round"/> <circle cx="75" cy="44" r="13" fill="#fff"/> <circle cx="79" cy="45" r="7" fill="#1B2B4B"/> </svg>
  <h1>Jedna fotka ráno.<br>Celý deň spolu.</h1>
  <p class="lead">Každé ráno sa odfotíš a tvoja rodina a kamaráti ťa celý deň vidia vo widgete na ploche telefónu. Čoskoro pre iPhone.</p>
  <form class="join" novalidate>
    <label class="hp">Nevypĺňaj <input name="web" tabindex="-1" autocomplete="off"></label>
    <input type="email" name="email" required placeholder="tvoj@email.sk" aria-label="Tvoj e-mail" autocomplete="email">
    <button class="btn" type="submit">Pridať sa</button>
  </form>
  <p class="msg" role="status" aria-live="polite"></p>
  <p class="fine">Napíšeme ti len raz, keď bude appka pripravená. E-mail na požiadanie kedykoľvek zmažeme.</p>
</main>
<footer>© 2026 Bopli · Vyrobené na Slovensku</footer>

<script>
// Waitlist API: a Cloudflare Worker that stores signups in a D1 database (see worker/).
const API = "https://klucenka-waitlist.jergus-golian.workers.dev/join";
const okEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

document.querySelectorAll("form.join").forEach(f => f.addEventListener("submit", async e => {
  e.preventDefault();
  const msg = f.nextElementSibling, btn = f.querySelector("button");
  const email = f.email.value.trim();
  msg.className = "msg";
  if (f.web.value) return;                       // honeypot: bot
  if (!okEmail(email)) { msg.textContent = "Skontroluj, prosím, e-mailovú adresu."; msg.classList.add("err"); f.email.focus(); return; }
  btn.disabled = true;
  try {
    const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, web: f.web.value }) });
    if (!res.ok) throw new Error(res.status);
    f.reset();
    msg.textContent = "Ďakujeme! Si na zozname. Ozveme sa, keď bude appka pripravená.";
    msg.classList.add("ok");
  } catch {
    msg.textContent = "Nepodarilo sa odoslať. Skús to, prosím, znova.";
    msg.classList.add("err");
  } finally { btn.disabled = false; }
}));
</script>
</body>
</html>
